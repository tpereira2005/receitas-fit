name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'design/**'
  workflow_dispatch:

permissions:
  contents: write

# As builds ficam em fila (não se cancelam), para nunca publicar uma versão a meio.
concurrency:
  group: build
  cancel-in-progress: false

env:
  SCHEME: ReceitasFit
  BUNDLE_ID: com.tpereira.receitasfit
  # Versão base; o número da build é acrescentado automaticamente (ex.: 1.1.7).
  VERSION_BASE: "1.1"

jobs:
  ipa:
    name: IPA e fonte do SideStore
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Definir versão
        run: echo "APP_VERSION=$VERSION_BASE.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Gerar projeto Xcode
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate
          grep -n "AppIcon.icon" ReceitasFit.xcodeproj/project.pbxproj

      - name: Compilar (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ReceitasFit.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions

      - name: Criar IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/$SCHEME.app" Payload/
          zip -qry "$SCHEME.ipa" Payload
          ls -lh "$SCHEME.ipa"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "Payload/$SCHEME.app/Info.plist"
          echo "Ícone na app:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "Payload/$SCHEME.app/Info.plist" || true
          ls "Payload/$SCHEME.app" | grep -i icon || true

      - name: Exportar variações do ícone
        run: |
          ICTOOL="$(xcode-select -p)/../Applications/Icon Composer.app/Contents/Executables/ictool"
          mkdir -p icon-renders
          for rendition in Default Dark TintedLight TintedDark ClearLight ClearDark; do
            "$ICTOOL" AppIcon.icon --export-image --output-file "icon-renders/$rendition.png" \
              --platform iOS --rendition "$rendition" --width 1024 --height 1024 --scale 1 \
              || echo "::warning::Não foi possível exportar $rendition"
          done
          ls -la icon-renders

      - uses: actions/upload-artifact@v5
        with:
          name: icon-renders
          path: icon-renders
          if-no-files-found: warn

      - uses: actions/upload-artifact@v5
        with:
          name: ReceitasFit-ipa
          path: ReceitasFit.ipa

      - name: Publicar versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > notes.txt
          # Release própria desta versão (link fixo usado pelo SideStore)
          gh release create "v$APP_VERSION" "$SCHEME.ipa" \
            --title "Receitas $APP_VERSION" \
            --notes-file notes.txt \
            --target "${{ github.sha }}" \
            --latest
          # Release "latest": link fixo para instalar à mão e para as capturas de ecrã
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$SCHEME.ipa" --clobber
            if [ -f icon-renders/Default.png ]; then
              cp icon-renders/Default.png AppIcon.png
              gh release upload latest AppIcon.png --clobber
            fi
            gh release edit latest --title "Receitas · última build ($APP_VERSION)" --latest=false
          else
            gh release create latest "$SCHEME.ipa" --title "Receitas · última build ($APP_VERSION)" \
              --notes "IPA e capturas de ecrã da última build." --latest=false
          fi
          # Manter só as 5 versões mais recentes
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^v' | sort -V -r | tail -n +6 \
            | xargs -I{} gh release delete {} --yes --cleanup-tag

      - name: Atualizar fonte do SideStore
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILD: ${{ github.run_number }}
        run: |
          export IPA_SIZE=$(stat -f%z "$SCHEME.ipa")
          export NOTES="$(cat notes.txt)"
          work=$(mktemp -d)
          python3 scripts/make_source.py > "$work/source.json"
          python3 -m json.tool "$work/source.json" > /dev/null
          cd "$work"
          printf '# Fonte do SideStore\n\nAdiciona este link no SideStore (Fontes → +):\n\nhttps://raw.githubusercontent.com/%s/sidestore/source.json\n' "$REPO" > README.md
          git init -q -b sidestore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Fonte SideStore $APP_VERSION"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" sidestore
          cat source.json

  screenshots:
    name: Capturas do simulador
    needs: ipa
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Gerar projeto Xcode
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Escolher simulador
        run: |
          DEVICES=$(xcrun simctl list devices available -j)
          UDID=$(echo "$DEVICES" | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | test("^iPhone [0-9]+ Pro$"))] | last | .udid // empty')
          if [ -z "$UDID" ]; then
            UDID=$(echo "$DEVICES" | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          fi
          xcrun simctl list devices | grep "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Compilar para o simulador
        run: |
          set -o pipefail
          xcodebuild build \
            -project ReceitasFit.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            | xcbeautify --renderer github-actions

      - name: Tirar capturas
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots

          shot() {
            local name="$1"; shift
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -AppleLanguages "(pt-PT)" -AppleLocale pt_PT "$@"
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }

          shot 1-inicio
          shot 2-receita -screenshotOpenFirst YES
          shot 3-pesquisa -tab search -screenshotSearch frango
          shot 4-alimentos -tab foods
          shot 5-alimento -tab foods -screenshotOpenFood YES
          shot 6-editor -screenshotEditFirst YES -screenshotEditorIngredients YES
          shot 7-receita-nutricao -screenshotOpenFirst YES -screenshotDetailScroll YES
          shot 8-explorar -tab explore
          shot 12-rever-receitas -tab foods -screenshotOpenFood YES -screenshotFoodReview YES
          xcrun simctl ui "$UDID" appearance dark
          shot 9-inicio-escuro
          shot 10-receita-escuro -screenshotOpenFirst YES
          shot 11-receita-nutricao-escuro -screenshotOpenFirst YES -screenshotDetailScroll YES

      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: screenshots

      - name: Anexar capturas à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --json assets --jq '.assets[].name' | grep '\.png$' \
            | xargs -I{} gh release delete-asset latest {} --yes
          gh release upload latest screenshots/*.png --clobber
