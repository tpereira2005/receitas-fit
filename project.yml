name: Receitas

options:
  bundleIdPrefix: com.tpereira
  developmentLanguage: pt-PT
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # O XcodeGen ainda não conhece os ficheiros do Icon Composer (.icon); corrige o tipo depois de gerar.
  postGenCommand: >-
    /usr/bin/perl -0pi -e 's/lastKnownFileType = [\w.]+; (name = AppIcon\.icon; )?path = AppIcon\.icon;/lastKnownFileType = folder.iconcomposer.icon; $1path = AppIcon.icon;/g'
    Receitas.xcodeproj/project.pbxproj

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 com isolamento no MainActor por omissão (modelo recomendado no Xcode 26):
    # o código de interface fica seguro sem anotações e o trabalho em segundo plano é explícito.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Receitas:
    type: application
    platform: iOS
    sources:
      - path: Receitas
      # Ícone da app no formato Icon Composer (Liquid Glass, modos escuro, transparente e matizado).
      - path: AppIcon.icon
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Receitas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-PT
        CFBundleLocalizations: [pt-PT]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: A câmara é usada para fotografar embalagens e ler a informação nutricional.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - ReceitasTests
        - ReceitasUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tpereira.receitasfit
        PRODUCT_NAME: Receitas
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  ReceitasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReceitasTests
    dependencies:
      - target: Receitas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tpereira.receitasfit.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  # Testes de interface: tocam nos ecrãs como um utilizador (enquadramento, filtros, Definições…).
  ReceitasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReceitasUITests
    dependencies:
      - target: Receitas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tpereira.receitasfit.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Receitas
        # O XCTest não aceita subclasses isoladas no MainActor por omissão; os testes marcam-se um a um.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
